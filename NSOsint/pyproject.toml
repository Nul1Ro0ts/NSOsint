# --- pyproject.toml ---
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsoint"
version = "1.2.7"
description = "NSOsint - open-source OSINT toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9.5",
    "dnspython>=2.6.1",
    "phonenumbers>=8.13.40",
    "python-whois>=0.9.4",
    "rich>=13.7.1",
    "click>=8.1.7",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
fast = ["aiodns>=3.2.0", "lxml>=5.2.2"]
dev  = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
nsoint = "nsoint.cli:cli"

[tool.setuptools.packages.find]
include = ["nsoint*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"